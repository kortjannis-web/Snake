# Baut bei jedem Push die Android-App (APK) und haengt sie an das Release "latest".
# Ohne Keystore-Secrets entsteht eine Debug-APK (fester Schluessel im Repo, Updates
# lassen sich drueberinstallieren). Mit Secrets (siehe README) eine signierte Release-APK.
name: Android-APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Keystore aus Secrets
        id: ks
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/snake.keystore"
            echo "file=$RUNNER_TEMP/snake.keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: APK bauen
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.ks.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="$(node -p "require('../package.json').version")"
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../snake-endlos.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../snake-endlos.apk
          fi

      # Die APK liegt dauerhaft im Release "latest". Das Artefakt ist nur zum schnellen Testen und
      # wird einen Tag aufbewahrt (sonst ist der Speicher bald voll und auch die Web-App kann nicht
      # mehr veroeffentlicht werden). Ein voller Speicher haelt den Release nicht auf
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: snake-endlos-apk
          path: snake-endlos.apk
          retention-days: 1

      - name: Release "latest" aktualisieren
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Snake Endlos (aktuell)
          prerelease: false
          make_latest: true
          body: |
            Aktuelle Android-App, automatisch gebaut aus ${{ github.sha }}.
            Herunterladen: snake-endlos.apk auf dem Handy öffnen und installieren
            (einmalig „Installation aus unbekannten Quellen“ erlauben).
          files: snake-endlos.apk
