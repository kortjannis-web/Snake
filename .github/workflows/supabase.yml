# Spielt die Datenbank-Aenderungen aus supabase/migrations auf das Supabase-Projekt, sobald
# sie auf den Hauptzweig kommen. Laeuft nur, wenn die drei Secrets eingetragen sind
# (siehe docs/ONLINE-EINRICHTEN.md, Schritt "Automatisch"); sonst wird der Lauf uebersprungen.
name: Supabase-Datenbank

on:
  push:
    paths: ['supabase/**']
  workflow_dispatch:
    inputs:
      bisher_von_hand:
        description: 'Einmalig: Alle bisherigen Dateien wurden schon von Hand eingespielt (NACHHOLEN.sql). Nur als erledigt eintragen, nichts ausfuehren.'
        type: boolean
        default: false

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrieren:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets vorhanden?
        id: pruefen
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Supabase-Secrets fehlen: Datenbank wird nicht automatisch aktualisiert."
          fi
      - if: steps.pruefen.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.pruefen.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      # Projekte, die bisher von Hand eingerichtet wurden, kennen die Liste der eingespielten Dateien nicht: dann wuerde
      # db push alles von vorn ausfuehren und an aelteren Ansichten scheitern. Einmal alle vorhandenen als erledigt eintragen
      - if: steps.pruefen.outputs.ok == 'true' && inputs.bisher_von_hand
        run: |
          versionen=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | tr '\n' ' ')
          echo "Als erledigt eintragen: $versionen"
          supabase migration repair --status applied $versionen --password "$SUPABASE_DB_PASSWORD"
      - if: steps.pruefen.outputs.ok == 'true' && !inputs.bisher_von_hand
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
