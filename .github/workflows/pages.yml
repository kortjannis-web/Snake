# Veroeffentlicht die Web-App (PWA) auf GitHub Pages. Einmalig in den Repo-Einstellungen
# unter Pages die Quelle "GitHub Actions" waehlen, sonst schlaegt nur dieser Schritt fehl.
name: Web-App (GitHub Pages)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Gruppe je Zweig: sonst bricht ein Push auf einen Nebenzweig (dessen Lauf ohnehin uebersprungen wird) die
# laufende Veroeffentlichung vom Hauptzweig ab, und das Update kommt nie online
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SNAKE_SERVER: ${{ vars.VITE_SNAKE_SERVER }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
