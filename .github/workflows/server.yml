# Veroeffentlicht den Snake-Server (Mehrspieler) auf Cloudflare Workers, sobald sich Server, Spiellogik
# oder Protokoll auf dem Hauptzweig aendern. Braucht die Secrets CLOUDFLARE_API_TOKEN und
# CLOUDFLARE_ACCOUNT_ID (siehe docs/MEHRSPIELER-EINRICHTEN.md); ohne sie wird der Lauf uebersprungen.
name: Snake-Server (Cloudflare)

on:
  push:
    paths: ['server/**', 'src/game/**', 'src/multi/protokoll.ts', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets vorhanden?
        id: pruefen
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare-Secrets fehlen: Server wird nicht veroeffentlicht."
          fi
      - if: steps.pruefen.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.pruefen.outputs.ok == 'true'
        run: npm ci
      - if: steps.pruefen.outputs.ok == 'true'
        run: npx vitest run test/raum.test.ts test/mehr.test.ts
      - if: steps.pruefen.outputs.ok == 'true'
        name: Veroeffentlichen
        run: npx wrangler deploy --config server/wrangler.toml
