# Snake-Server: ein Worker, der fuer jeden Raum ein Durable Object startet (Gratis-Tarif: SQLite-Klasse).
# Veroeffentlichen: .github/workflows/server.yml (oder lokal: npx wrangler deploy --config server/wrangler.toml)
name = "snake-server"
main = "index.ts"
compatibility_date = "2025-09-01"

# Kontakt fuer Push-Dienste (VAPID); die Schluessel kommen als Secrets dazu (siehe Anleitung)
[vars]
VAPID_KONTAKT = "https://github.com/kortjannis-web/Snake"

[[durable_objects.bindings]]
name = "RAUM"
class_name = "Raum"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Raum"]
